version: 1
project:
  name: blink_kernel_freertos_s3
  type: platform
  device: SIMG301M104LIL
  toolchain: arm-none-eabi-gcc

sdk:
  vendor: silabs
  id: simplicity_sdk
  version: 2025.12.2

components:
  - id: SIMG301M104LIL
    vendor: silabs
    package: simplicity_sdk
  - id: brd4407a
    vendor: silabs
    package: simplicity_sdk
  - id: clock_manager
    vendor: silabs
    package: simplicity_sdk
  - id: device_init
    vendor: silabs
    package: simplicity_sdk
  - id: freertos
    vendor: silabs
    package: simplicity_sdk
  - id: simple_led
    vendor: silabs
    package: simplicity_sdk
  - id: sl_main
    vendor: silabs
    package: simplicity_sdk
  - id: sleeptimer
    vendor: silabs
    package: simplicity_sdk

build:
  cmake_dir: cmake_gcc
  preset: project
  configurations:
    - base
  artifacts:
    - .bin
    - .hex
    - .map

ci:
  # NOTE: Silicon Labs does not distribute an official public Docker image.
  # The build runs directly on the GitHub-provided ubuntu runner.
  # Required tools (cmake, ninja, arm-none-eabi-gcc) are installed via apt.
  # The Silicon Labs SDK must be provided separately:
  #   Option 1 - Upload the SDK tarball as a GitHub Release asset named '*sdk*'
  #   Option 2 - Build locally with Simplicity Studio and commit the artifacts
  runner: ubuntu-22.04
  tools:
    - cmake
    - ninja
    - arm-none-eabi-gcc