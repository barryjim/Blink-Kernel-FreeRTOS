name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  CodeAnalysis:
    name: Code Quality Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize runner disk
        uses: ./.github/actions/maximize-runner-disk

      - name: Make scripts executable
        run: |
          chmod +x scripts/*/*.sh scripts/**/*.sh

      - name: Setup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3-pip

      - name: Setup cpplint
        run: |
          if [ ! -d "third_party" ]; then
            mkdir -p third_party
          fi
          if [ ! -d "third_party/cpplint" ]; then
            git clone --depth 1 https://github.com/cpplint/cpplint.git third_party/cpplint
          fi

      - name: Setup cppcheck
        run: |
          if [ ! -d "third_party/cppcheck" ]; then
            bash ./scripts/cppcheck/setup.sh
          fi

      - name: Run cpplint
        run: |
          bash ./scripts/linter/linter.sh -p

      - name: Run cppcheck
        run: |
          bash ./scripts/cppcheck/runner.sh

      - name: Upload code quality report
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: code_quality_report
          path: code_quality_report/
          retention-days: 30

  FormatCheck:
    name: Code Format Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize runner disk
        uses: ./.github/actions/maximize-runner-disk

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format

      - name: Check formatting
        run: |
          bash ./scripts/format/format.sh -d

  Build:
    name: Build Firmware
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/silabs-software/slc-build:latest
      options: --user root
    needs: [CodeAnalysis, FormatCheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SLC tools
        run: |
          echo "SLC tools:"
          cmake --version 2>/dev/null || echo "cmake not found"
          ninja --version 2>/dev/null || echo "ninja not found"
          arm-none-eabi-gcc --version 2>/dev/null | head -1 || echo "arm-none-eabi-gcc not found"
          python3 --version 2>/dev/null || echo "python3 not found"
          echo "SLCP file:"
          ls -la *.slcp 2>/dev/null || echo "No .slcp file"

      - name: Build firmware
        id: build
        shell: bash
        run: |
          set +e
          WORKSPACE="${{ github.workspace }}"
          PROJECT_NAME="${{ github.event.repository.name }}"
          OUT_DIR="${WORKSPACE}/artifacts/${PROJECT_NAME}"
          mkdir -p "${OUT_DIR}"

          CMAKE_DIR="${WORKSPACE}/cmake_gcc"
          if [ ! -d "${CMAKE_DIR}" ]; then
            echo "::error::cmake_gcc directory not found"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
            exit 0
          fi

          cd "${CMAKE_DIR}"

          echo "=== Patching CMake configuration ==="
          CMAKE_FILE="blink_kernel_freertos_s3.cmake"
          SDK_DIR="${WORKSPACE}/simplicity_sdk"

          if [ -d "/opt/simplicity-sdk" ]; then
            SDK_PATH="/opt/simplicity-sdk"
          elif [ -d "/opt/silabs-sdk" ]; then
            SDK_PATH="/opt/silabs-sdk"
          elif [ -d "/home/silabs/sdk" ]; then
            SDK_PATH="/home/silabs/sdk"
          elif [ -d "/sdk" ]; then
            SDK_PATH="/sdk"
          else
            SDK_PATH=$(find / -maxdepth 6 -type d -name "SIMG301" -path "*/Device/SiliconLabs/*" 2>/dev/null | head -1 | sed 's|/devices.*||')
            [ -z "${SDK_PATH}" ] && SDK_DIR="${WORKSPACE}/simplicity_sdk"
            [ -z "${SDK_PATH}" ] && SDK_PATH="${SDK_DIR}"
          fi

          echo "Using SDK at: ${SDK_PATH}"

          if [ -f "${CMAKE_FILE}" ]; then
            cp "${CMAKE_FILE}" "${CMAKE_FILE}.bak"
            sed -i "s|set(SDK_PATH \"[^\"]*\")|set(SDK_PATH \"${SDK_PATH}\")|" "${CMAKE_FILE}"
            sed -i "s|set(PKG_PATH \"[^\"]*\")|set(PKG_PATH \"${SDK_PATH}/..\")|" "${CMAKE_FILE}"
            echo "[OK] Patched CMake"
          fi

          export ARM_GCC_DIR="/usr"
          export NINJA_EXE_PATH="/usr/bin/ninja"
          export SILABS_SDK_PATH="${SDK_PATH}"

          echo "=== Configuring CMake ==="
          cmake --preset project \
                -D"CMAKE_CONFIGURATION_TYPES=base" \
                -D"ARM_GCC_DIR=${ARM_GCC_DIR}" \
                -D"NINJA_EXE_PATH=${NINJA_EXE_PATH}" 2>&1
          CFG_RESULT=$?

          BUILD_DIR="${CMAKE_DIR}/build"
          if [ ${CFG_RESULT} -ne 0 ] || [ ! -d "${BUILD_DIR}" ]; then
            echo "::error::CMake configure failed (exit=${CFG_RESULT})"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "=== Building ==="
          cmake --build "${BUILD_DIR}" --config "base" 2>&1
          BUILD_RESULT=$?

          cd "${WORKSPACE}"
          if [ ${BUILD_RESULT} -ne 0 ]; then
            echo "::error::Build failed (exit=${BUILD_RESULT})"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "[OK] Build succeeded"

          echo "=== Collecting artifacts ==="
          FW_DIR="${BUILD_DIR}/base"
          [ ! -d "${FW_DIR}" ] && FW_DIR="${BUILD_DIR}"
          copied=0
          for ext in .bin .hex .s37 .map .out; do
            src="${FW_DIR}/${PROJECT_NAME}${ext}"
            if [ -f "${src}" ]; then
              cp "${src}" "${OUT_DIR}/"
              echo "  [OK] ${PROJECT_NAME}${ext}"
              copied=$((copied + 1))
            fi
          done
          if [ ${copied} -eq 0 ]; then
            echo "::warning::No artifacts found"
            echo "success=false" >> $GITHUB_OUTPUT
          else
            echo "[OK] Collected ${copied} artifact(s)"
            echo "success=true" >> $GITHUB_OUTPUT
          fi
          echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
          echo "Result: $([ ${copied} -gt 0 ] && echo 'SUCCESS' || echo 'NO ARTIFACTS')"
          echo "SDK:    ${SDK_PATH}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: steps.build.outputs.success == 'true'
        with:
          name: build_artifacts
          path: ${{ steps.build.outputs.artifacts_dir }}
          retention-days: 30