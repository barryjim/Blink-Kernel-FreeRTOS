name: Release

on:
  push:
    tags:
      - 'v*'
      - 'blink_kernel_freertos_s3-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  CodeAnalysis:
    name: Pre-release Code Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/*/*.sh scripts/**/*.sh

      - name: Setup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3-pip

      - name: Setup cpplint
        run: |
          if [ ! -d "third_party" ]; then
            mkdir -p third_party
          fi
          if [ ! -d "third_party/cpplint" ]; then
            git clone --depth 1 https://github.com/cpplint/cpplint.git third_party/cpplint
          fi

      - name: Run cpplint
        run: |
          bash ./scripts/linter/linter.sh -p

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: lint_report
          path: code_quality_report/
          retention-days: 30

  Build:
    name: Build & Package
    needs: CodeAnalysis
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/*/*.sh scripts/**/*.sh

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi cmake ninja-build

      - name: Determine tag version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag_name }}}"
          VERSION=$(echo "$TAG" | sed 's/^v//' | sed 's/^blink_kernel_freertos_s3-//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION} from tag: ${TAG}"

      - name: Build (best effort)
        id: build
        run: |
          set +e
          bash ./scripts/fw_packaging/artifacts.sh -t base
          if [ -f "artifacts/artifacts.tar.gz" ] && [ -s "artifacts/artifacts.tar.gz" ]; then
            echo "build_success=true" >> $GITHUB_OUTPUT
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
            echo "::warning::Build requires Silicon Labs Simplicity Studio SDK. Skipping build on GitHub Actions."
          fi

      - name: Prepare release assets
        run: |
          cd artifacts
          if [ -f "artifacts.tar.gz" ] && [ -s "artifacts.tar.gz" ]; then
            echo "Build artifacts ready for release."
          else
            echo "No build artifacts - SDK not available on GitHub Actions."
            echo "Build locally with Simplicity Studio and upload firmware files to the release."
            echo "Release created with code quality reports only."
            touch artifacts.tar.gz
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release_artifacts
          path: artifacts/artifacts.tar.gz
          retention-days: 90

  Release:
    name: Create GitHub Release
    needs: Build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release_artifacts
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/artifacts.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false