name: Release

on:
  push:
    tags:
      - 'v*'
      - 'blink_kernel_freertos_s3-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  CodeAnalysis:
    name: Pre-release Code Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize runner disk
        uses: ./.github/actions/maximize-runner-disk

      - name: Make scripts executable
        run: |
          chmod +x scripts/*/*.sh scripts/**/*.sh

      - name: Setup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3-pip

      - name: Setup cpplint
        run: |
          if [ ! -d "third_party" ]; then
            mkdir -p third_party
          fi
          if [ ! -d "third_party/cpplint" ]; then
            git clone --depth 1 https://github.com/cpplint/cpplint.git third_party/cpplint
          fi

      - name: Run cpplint
        run: |
          bash ./scripts/linter/linter.sh -p

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: lint_report
          path: code_quality_report/
          retention-days: 30

  Build:
    name: Build & Package
    needs: CodeAnalysis
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag_name }}}"
          VERSION=$(echo "$TAG" | sed 's/^v//' | sed 's/^blink_kernel_freertos_s3-//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION} from tag: ${TAG}"

      - name: Build firmware
        id: build
        uses: ./.github/actions/build-firmware
        with:
          cmake_preset: project
          build_config: base
          fail_on_error: false

      - name: Prepare release assets
        run: |
          if [ "${{ steps.build.outputs.success }}" == "true" ]; then
            echo "Build artifacts ready for release."
            ARTIFACTS_DIR="${{ steps.build.outputs.artifacts_dir }}"
            tar -zcvf artifacts.tar.gz -C "$(dirname ${ARTIFACTS_DIR})" "$(basename ${ARTIFACTS_DIR})"
          else
            echo "::warning::Build requires Silicon Labs SDK. No firmware artifacts generated."
            echo "Build locally with Simplicity Studio and upload firmware to the release."
            touch artifacts.tar.gz
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release_artifacts
          path: artifacts.tar.gz
          retention-days: 90

  Release:
    name: Create GitHub Release
    needs: Build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release_artifacts
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/artifacts.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false