# =============================================================================
# 可复用发布工作流模板
# =============================================================================
# 本工作流使用 workflow_call 触发，支持被任意平台的入口工作流调用。
# 设计为多平台通用（silabs_mg301 / qorvo_qpg62 等），通过 platform 参数区分。
#
# 完整执行流程：CodeAnalysis → UnitTest → Build → Release
#
# 作者：CI/CD Team
# =============================================================================

# ---------- 工作流触发与输入参数 ----------
on:
  workflow_call:
    inputs:
      ref:
        description: "代码分支或标签引用（如 silabs_mg301_langdmatt）"
        required: true
        type: string
      platform:
        description: "平台标识（如 silabs_mg301 / qorvo_qpg62）"
        required: true
        type: string
      enable_code_analysis:
        description: "是否启用代码分析（cpplint + cppcheck）"
        type: boolean
        default: true
      enable_unit_test:
        description: "是否启用单元测试（cmocka + 覆盖率）"
        type: boolean
        default: true
      build_all_types:
        description: "构建类型（debug / dev / release），默认 dev"
        type: string
        default: dev
      build_test_upgrade:
        description: "是否构建 OTA 升级测试固件（版本号自动+1）"
        type: boolean
        default: true
    secrets:
      platform_sdk_token:
        description: "SDK 访问令牌（用于私有仓库认证），可选"
        required: false

# ---------- Job 1: 代码分析 ----------
# 功能：对源代码进行静态分析和风格检查，生成代码质量报告
# 执行：cpplint（代码风格）+ cppcheck（潜在缺陷）
# 产物：code_quality_report.tar.gz
jobs:
  CodeAnalysis:
    # 根据输入参数决定是否执行此 Job
    if: ${{ inputs.enable_code_analysis }}
    runs-on: ubuntu-22.04
    steps:
      # Step 1: 拉取指定分支/标签的代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Step 2: 为 MG301 平台额外拉取匹配命名格式的 Tags
      # 原因：silabs_mg301-* 格式的 tag 在其他分支上，需要单独 fetch 才能 checkout
      - name: Fetch siliconlabs mg301 refs (Only Silabs MG301 requires)
        if: inputs.platform == 'silabs_mg301'
        run: git fetch origin '+refs/tags/silabs_mg301-*:refs/tags/silabs_mg301-*'

      # Step 3: 如果当前触发是 Tag 推送，则切换到该 Tag 对应代码
      - name: Checkout Tag
        if: startsWith(github.event.ref, 'refs/tags/')
        run: git checkout ${{ github.ref_name }}

      # Step 4: 缓存 cppcheck 编译产物，key 随 setup.sh 哈希变化自动失效
      # 作用：避免每次重新编译 cppcheck，节省 CI 时间
      - name: Cache cppcheck
        uses: actions/cache@v4
        with:
          path: ./${{ inputs.platform }}/third_party/cppcheck
          key: ${{ runner.os }}-${{ inputs.platform }}-cppcheck-modules-${{ hashFiles('${{ inputs.platform }}/scripts/cppcheck/setup.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.platform }}-cache-cppcheck-modules-

      # Step 5: 依次执行代码风格检查和静态分析
      # 5a. cpplint 代码风格检查（排除 SDK/第三方/脚本等目录）
      # 5b. cppcheck 静态分析（检查 warning/style/performance/portability 问题）
      # 5c. 将生成的报告目录打包为压缩包
      - name: Run Code Analysis
        run: |
          if [ -f "./${{ inputs.platform }}/scripts/linter/setup.sh" ]; then
            source ./${{ inputs.platform }}/scripts/linter/setup.sh       # 安装 cpplint
            source ./${{ inputs.platform }}/scripts/linter/linter.sh -p   # 运行 cpplint 并生成 XML 报告
          fi
          if [ -f "./${{ inputs.platform }}/scripts/cppcheck/setup.sh" ]; then
            source ./${{ inputs.platform }}/scripts/cppcheck/setup.sh     # 安装 cppcheck
            source ./${{ inputs.platform }}/scripts/cppcheck/runner.sh    # 运行 cppcheck 并生成 XML+HTML 报告
          fi
          # 将报告目录压缩打包
          [ -d "./${{ inputs.platform }}/code_quality_report" ] && \
            tar -zcvf code_quality_report.tar.gz -C${{ inputs.platform }} code_quality_report
        shell: bash

      # Step 6: 上传代码质量报告为 CI 产物，供后续 Job 和 Release 使用
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: code_quality_report
          path: ./code_quality_report.tar.gz

# ---------- Job 2: 单元测试 ----------
# 功能：使用 cmocka 框架运行组件级单元测试，生成覆盖率报告
# 依赖：CodeAnalysis 成功（或被跳过）
# 产物：unit_test_report.tar.gz
  UnitTest:
    # 前置条件：未取消 + 启用单元测试 + CodeAnalysis 成功或跳过
    if: ${{ !cancelled() && inputs.enable_unit_test && (needs.CodeAnalysis.result == 'success' || needs.CodeAnalysis.result == 'skipped') }}
    needs: CodeAnalysis
    runs-on: ubuntu-22.04
    steps:
      # Step 1: 拉取代码（每个 Job 独立拉取，确保环境隔离）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Step 2: Tag 触发时切换到对应 Tag
      - name: Checkout Tag
        if: startsWith(github.event.ref, 'refs/tags/')
        run: git checkout ${{ github.ref_name }}

      # Step 3: 配置 Git 用户信息，并将 SDK Token 写入本地文件
      # Token 用于 checkout.sh 中访问私有 SDK 仓库的认证
      - name: Git config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "action"
          if [ -n "${{ secrets.platform_sdk_token }}" ]; then
            echo "Token is provided, writing to file..."
            echo "${{ secrets.platform_sdk_token }}" > ./${{ inputs.platform }}/scripts/setup/token
          fi
        shell: bash

      # Step 4: 浅克隆 SDK（-s 参数：--depth 1 节省时间）
      # 包含 Silabs Simplicity SDK 2024.12 + Matter Extension v2.5.0
      # 克隆完成后自动应用 patches 和 sdk_commit_tmp 覆盖层
      - name: Clone SDK 
        run: source ./${{ inputs.platform }}/scripts/setup/checkout.sh -s
        shell: bash

      # Step 5: 运行单元测试
      # 5a. setup.sh：安装 cmocka 测试框架 + gcovr 覆盖率工具
      # 5b. runner.sh：cmake 配置 + make 编译 + ctest 执行所有测试
      # 5c. codecoverage.sh -w：生成 HTML 格式代码覆盖率报告
      # 5d. 将所有报告打包压缩
      - name: Run Unit Tests
        run: |
          if [ -f "./${{ inputs.platform }}/scripts/unittest/setup.sh" ]; then
            source ./${{ inputs.platform }}/scripts/unittest/setup.sh
            mkdir -p ./${{ inputs.platform }}/unit_test_report
            source ./${{ inputs.platform }}/scripts/unittest/runner.sh > ./${{ inputs.platform }}/unit_test_report/unit_test_report.txt
            [ -f "./${{ inputs.platform }}/scripts/unittest/codecoverage.sh" ] && \
              source ./${{ inputs.platform }}/scripts/unittest/codecoverage.sh -w
          fi
          [ -d "./${{ inputs.platform }}/unit_test_report" ] && \
            tar -zcvf unit_test_report.tar.gz -C${{ inputs.platform }} unit_test_report
        shell: bash

      # Step 6: 上传测试报告为 CI 产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: unit_test_report
          path: ./unit_test_report.tar.gz

# ---------- Job 3: 固件构建 ----------
# 功能：克隆完整 SDK → 配置环境 → 编译所有活跃项目 → 打包固件产物
# 依赖：CodeAnalysis + UnitTest 均成功（或跳过）
# 产物：artifacts.tar.gz（包含 .s37 固件、.ota 升级包等）
  Build:
    # 前置条件：两个前置 Job 都成功或被跳过
    if: ${{ !cancelled() && (needs.CodeAnalysis.result == 'success' || needs.CodeAnalysis.result == 'skipped') && 
           (needs.UnitTest.result == 'success' || needs.UnitTest.result == 'skipped') }}
    needs: [CodeAnalysis, UnitTest]
    runs-on: ubuntu-22.04
    steps:
      # Step 1: 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Step 2: Qorvo 平台需要移除系统自带的 ninja（版本冲突）
      - name: Remove Ninja (Only Qorvo requires)
        if: inputs.platform == 'qorvo_qpg62'
        run: |
          which ninja && sudo rm $(which ninja) || true
        shell: bash

      # Step 3: 自定义 Action — 释放 GitHub Runner 磁盘空间
      # 删除 /usr/share/dotnet (1.6GB) 和 /usr/local/lib/android/sdk (8.9GB)
      # 为 SDK + Matter Extension + 编译产物腾出足够空间
      - name: Maximize runner disk
        uses: ./.github/actions/maximize-runner-disk

      # Step 4: MG301 平台额外 fetch 匹配的 tag
      - name: Fetch siliconlabs mg301 refs (Only Silabs MG301 requires)
        if: inputs.platform == 'silabs_mg301'
        run: git fetch origin '+refs/tags/silabs_mg301-*:refs/tags/silabs_mg301-*'

      # Step 5: Tag 触发时切换到对应 Tag
      - name: Checkout Tag
        if: startsWith(github.event.ref, 'refs/tags/')
        run: git checkout ${{ github.ref_name }}

      # Step 6: 配置 Git 和写入 SDK Token
      - name: Git config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "action"
          if [ -n "${{ secrets.platform_sdk_token }}" ]; then
            echo "Token is provided, writing to file..."
            echo "${{ secrets.platform_sdk_token }}" > ./${{ inputs.platform }}/scripts/setup/token
          fi
        shell: bash

      # Step 7: 克隆完整 SDK（MG301 使用浅克隆，Qorvo 跳过）
      # 包含 Silabs Simplicity SDK 2024.12 + Matter Extension v2.5.0
      # 克隆后自动应用 patches（matter_extension 适配 + sixx301 支持 + sdk_commit_tmp 覆盖）
      - name: Clone SDK
        if: inputs.platform != 'qorvo_qpg62'
        run: source ./${{ inputs.platform }}/scripts/setup/checkout.sh -s
        shell: bash

      # Step 8: 激活构建环境
      # 安装 Python 依赖（dload、dotenv），读取 active_projects 获取目标项目，执行 generate.sh
      - name: Setup environment
        if: inputs.platform != 'qorvo_qpg62'
        run: source ./${{ inputs.platform }}/scripts/setup/activate.sh
        shell: bash

      # Step 9a: 开发构建（非 Tag 触发）
      # 遍历 active_projects 中列出的所有项目，按指定构建类型（dev/debug/release）编译
      # 可选：-u 参数启用 OTA 升级测试构建（版本号自动+1后编译再恢复）
      - name: Build all projects
        if: false == startsWith(github.event.ref, 'refs/tags/')
        run: |
          ARGS=()
          [ -n "${{ inputs.build_all_types }}" ] && ARGS+=("-t" "${{ inputs.build_all_types }}")
          [ "${{ inputs.build_test_upgrade }}" = "true" ] && ARGS+=("-u")
          echo "Args: ${ARGS[*]}"
          source ./${{ inputs.platform }}/scripts/fw_packaging/artifacts.sh "${ARGS[@]}"
        shell: bash

      # Step 9b: 发布构建（Tag 触发）
      # 从 Tag 名解析项目名：silabs_mg301-{project}-{version}
      # 例如 tag "silabs_mg301-ws_pendant_concurrent-1.0.0" → 项目 "ws_pendant_concurrent"
      # 只构建该项目，使用 -p 参数指定
      - name: Build release project
        if: startsWith(github.event.ref, 'refs/tags/')
        run: |
          RELEASE_PROJECT=$(echo "${{ github.ref_name }}" | awk -F '-' '{print $2}')
          if [ -z "$RELEASE_PROJECT" ]; then
            echo "::error::Invalid tag format: ${{ github.ref_name }}. Expected format: 'prefix-projectName-version'"
            exit 1
          fi
          echo "Release project: $RELEASE_PROJECT"
          ARGS=("-p" "$RELEASE_PROJECT")
          [ "${{ inputs.build_test_upgrade }}" = "true" ] && ARGS+=("-u")
          echo "Args: ${ARGS[*]}"
          source ./${{ inputs.platform }}/scripts/fw_packaging/artifacts.sh "${ARGS[@]}"
        shell: bash

      # Step 10: 上传固件产物为 CI 产物
      # 包含：.s37 固件文件、.ota 升级包、bootloader、factory_test 等
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: ./${{ inputs.platform }}/artifacts/artifacts.tar.gz

# ---------- Job 4: 创建 GitHub Release ----------
# 功能：下载所有产物，创建正式的 GitHub Release
# 仅在 Tag 推送触发时执行（即正式发布流程）
# 权限：需要 contents: write（创建 Release 和上传附件）
  Release:
    # 前置条件：Build 成功 + 是 Tag 触发
    if: ${{ !cancelled() && (needs.Build.result == 'success') && startsWith(github.event.ref, 'refs/tags/') }}
    needs: Build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Step 1: 下载所有前置 Job 上传的产物
      # actions/download-artifact@v4 会把 code_quality_report、unit_test_report、artifacts 全部下载到当前目录
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: .

      # Step 2: 创建 GitHub Release
      # - 附加产物：代码质量报告（可选）、单元测试报告（可选）、固件产物（必选）
      # - MG301 平台直接发布（非草稿），其他平台默认为草稿模式供审核
      # - fail_on_unmatched_files: true 确保文件路径错误时 Job 失败
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ inputs.enable_code_analysis && 'code_quality_report/code_quality_report.tar.gz' || '' }}
            ${{ inputs.enable_unit_test && 'unit_test_report/unit_test_report.tar.gz' || '' }}
            artifacts/artifacts.tar.gz
          draft: ${{ inputs.platform != 'silabs_mg301' }}
          fail_on_unmatched_files: true