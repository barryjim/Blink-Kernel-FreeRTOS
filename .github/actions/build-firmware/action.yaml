name: 'Embedded Firmware Builder (Composite)'
description: 'Build embedded firmware using ARM GCC cross-compiler.'
inputs:
  cmake_preset:
    description: 'CMake preset name (defined in CMakePresets.json)'
    required: false
    default: 'project'
  build_config:
    description: 'Build configuration (e.g., base, debug, release)'
    required: false
    default: 'base'
  fail_on_error:
    description: 'Fail the workflow if build fails'
    required: false
    default: 'false'

outputs:
  success:
    description: 'Build result (true/false)'
    value: ${{ steps.build.outputs.success }}
  artifacts_dir:
    description: 'Path to the built artifacts directory'
    value: ${{ steps.build.outputs.artifacts_dir }}

runs:
  using: 'composite'
  steps:
    - name: Maximize runner disk space
      uses: ./.github/actions/maximize-runner-disk

    - name: Install build tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          gcc-arm-none-eabi cmake ninja-build binutils-arm-none-eabi \
          libnewlib-arm-none-eabi python3 python3-pip wget unzip

    - name: Install Silicon Labs tools
      shell: bash
      run: |
        echo "=== Installing dload (Silicon Labs downloader) ==="
        pip3 install --upgrade pip -q
        pip3 install dload dotenv -q 2>/dev/null || echo "[WARN] dload install failed"

        echo ""
        echo "=== Downloading SLT (Silicon Labs Toolkit) ==="
        SLT_DIR="${RUNNER_TEMP}/slt-toolkit"
        mkdir -p "${SLT_DIR}"
        cd "${SLT_DIR}"

        SLT_DOWNLOADED=0
        SLT_URLS=(
          "https://www.silabs.com/documents/public/software/slt-linux-amd64.tar.gz"
          "https://www.silabs.com/documents/public/software/slt-toolkit-linux.tar.gz"
          "https://www.silabs.com/develop-tools/simplicity-studio/slt-toolkit"
        )

        for url in "${SLT_URLS[@]}"; do
          echo "Trying: ${url}"
          if wget -q --timeout=30 --tries=2 "${url}" -O slt.tar.gz 2>&1; then
            echo "[OK] Downloaded SLT from ${url}"
            tar xzf slt.tar.gz 2>/dev/null || tar xf slt.tar.gz 2>/dev/null
            SLT_DOWNLOADED=1
            break
          fi
        done

        if [ ${SLT_DOWNLOADED} -eq 0 ]; then
          echo "[WARN] SLT download failed"
        else
          SLT_BIN=$(find . -name "slt" -type f 2>/dev/null | head -1)
          if [ -n "${SLT_BIN}" ]; then
            chmod +x "${SLT_BIN}"
            echo "[OK] Found SLT: ${SLT_BIN}"
            echo "${SLT_BIN}" > "${RUNNER_TEMP}/slt-path"
          fi
        fi

        echo ""
        echo "=== Verifying tools ==="
        echo "ARM GCC: $(arm-none-eabi-gcc --version | head -1)"
        echo "CMake:   $(cmake --version | head -1)"
        echo "Ninja:   $(ninja --version)"
        echo "Python:  $(python3 --version)"
        echo "dload:   $(python3 -c 'import dload; print(dload.__version__)' 2>/dev/null || echo 'not available')"
        SLT_PATH=$(cat "${RUNNER_TEMP}/slt-path" 2>/dev/null || echo "")
        echo "SLT:     ${SLT_PATH:-not available}"

    - name: Build firmware
      id: build
      shell: bash
      run: |
        set +e
        WORKSPACE="${{ github.workspace }}"
        CMAKE_PRESET="${{ inputs.cmake_preset }}"
        BUILD_CONFIG="${{ inputs.build_config }}"
        FAIL_ON_ERROR="${{ inputs.fail_on_error }}"
        PROJECT_NAME="${{ github.event.repository.name }}"
        OUT_DIR="${WORKSPACE}/artifacts/${PROJECT_NAME}"
        mkdir -p "${OUT_DIR}"

        # ========== Locate CMake dir ==========
        CMAKE_DIR=""
        if [ -f "${WORKSPACE}/cmake_gcc/CMakePresets.json" ]; then
            CMAKE_DIR="${WORKSPACE}/cmake_gcc"
        elif [ -f "${WORKSPACE}/CMakePresets.json" ]; then
            CMAKE_DIR="${WORKSPACE}"
        else
            echo "::error::No CMakePresets.json found"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
            exit 0
        fi

        # ========== Get SDK ==========
        SDK_DIR="${WORKSPACE}/simplicity_sdk"
        mkdir -p "${SDK_DIR}"
        SLT_PATH=$(cat "${RUNNER_TEMP}/slt-path" 2>/dev/null || echo "")
        SDK_PATH=""

        echo "=== Silicon Labs SDK Setup ==="

        # --- Method 1: Use SLT to install SDK ---
        if [ -n "${SLT_PATH}" ] && [ -x "${SLT_PATH}" ]; then
          echo "[METHOD 1] Using SLT Toolkit..."
          "${SLT_PATH}" setup 2>&1 || true
          for pkg in simplicity_sdk simg301 simplemg301; do
            echo "  Trying: slt install ${pkg}"
            "${SLT_PATH}" install "${pkg}" 2>&1 && { echo "[OK] Installed: ${pkg}"; break; }
          done
        fi

        # --- Method 2: Use dload ---
        echo ""
        echo "[METHOD 2] Using dload..."
        SLCP_FILE="${WORKSPACE}/${PROJECT_NAME}.slcp"
        if [ -f "${SLCP_FILE}" ]; then
          echo "  Project config: ${SLCP_FILE}"
          python3 -m dload --file "${SLCP_FILE}" --out "${SDK_DIR}" 2>&1 || \
          python3 -m dload download --config "${SLCP_FILE}" --dest "${SDK_DIR}" 2>&1 || \
          echo "[WARN] dload failed"
        else
          echo "  No .slcp file found, skipping dload"
        fi

        # --- Method 3: Search filesystem ---
        echo ""
        echo "[METHOD 3] Searching for SDK..."
        for candidate in \
            "${SDK_DIR}" \
            "${HOME}/.silabs/sdk" \
            "${HOME}/.silabs/slt/installs" \
            "/opt/simplicity-sdk" \
            "/tmp/simplicity_sdk"; do
            if [ -d "${candidate}" ] && [ -d "${candidate}/devices/platform/Device/SiliconLabs/SIMG301" ]; then
                SDK_PATH="${candidate}"
                echo "[OK] Found SDK: ${SDK_PATH}"
                break
            fi
        done

        if [ -z "${SDK_PATH}" ]; then
            SDK_PATH=$(find "${HOME}" /opt /usr/share /tmp -maxdepth 8 \
                -type d -name "SIMG301" -path "*/Device/SiliconLabs/*" 2>/dev/null | head -1 | sed 's|/devices.*||')
            [ -n "${SDK_PATH}" ] && echo "[OK] Found SDK: ${SDK_PATH}"
        fi

        # --- Method 4: Download from GitHub Release Assets ---
        if [ -z "${SDK_PATH}" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
          echo ""
          echo "[METHOD 4] Downloading SDK from GitHub Release Assets..."
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          ASSET_URL=$(curl -sL "${API_URL}" | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    assets = data.get('assets', [])
    for a in assets:
        if 'sdk' in a.get('name','').lower() or 'simplicity' in a.get('name','').lower():
            print(a['browser_download_url'])
            break
except:
    pass
" 2>/dev/null)
          if [ -n "${ASSET_URL}" ]; then
            echo "  Found SDK asset, downloading..."
            if wget -q --timeout=120 --tries=2 "${ASSET_URL}" -O /tmp/simplicity-sdk.tar.gz 2>&1; then
              echo "[OK] Downloaded SDK from release"
              tar xzf /tmp/simplicity-sdk.tar.gz -C "${SDK_DIR}" 2>/dev/null || \
              tar xf /tmp/simplicity-sdk.tar.gz -C "${SDK_DIR}" 2>/dev/null || \
              unzip -qo /tmp/simplicity-sdk.tar.gz -d "${SDK_DIR}" 2>/dev/null || true
              SDK_PATH=$(find "${SDK_DIR}" -maxdepth 3 -name "SIMG301" -type d 2>/dev/null | head -1 | sed 's|/devices.*||')
              [ -n "${SDK_PATH}" ] || SDK_PATH="${SDK_DIR}"
              [ -n "${SDK_PATH}" ] && echo "[OK] SDK at: ${SDK_PATH}"
            fi
          else
            echo "  No SDK release asset found"
          fi
        fi

        if [ -z "${SDK_PATH}" ]; then
          echo "::error::SDK not found. Cannot build."
          echo "::error::To fix this, you need the Silicon Labs Simplicity SDK."
          echo "::error::"
          echo "::error::Option A - Upload SDK to GitHub Releases:"
          echo "::error::  1. Download Simplicity SDK from https://www.silabs.com/develop-tools/simplicity-studio"
          echo "::error::     (Version 2025.12.2 for chip SIMG301M104LIL)"
          echo "::error::  2. Create a GitHub Release and upload the SDK .tar.gz as an asset"
          echo "::error::     (name it with 'sdk' or 'simplicity' in the filename)"
          echo "::error::  3. Push a new commit to re-trigger the workflow"
          echo "::error::"
          echo "::error::Option B - Use local SDK:"
          echo "::error::  Install Simplicity Studio locally and copy the SDK to this repo"
          echo "success=false" >> $GITHUB_OUTPUT
          echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
          if [ "${FAIL_ON_ERROR}" == "true" ]; then
            exit 1
          fi
          exit 0
        fi

        # ========== Patch CMake file ==========
        CMAKE_FILE="${CMAKE_DIR}/blink_kernel_freertos_s3.cmake"
        if [ -f "${CMAKE_FILE}" ]; then
            cp "${CMAKE_FILE}" "${CMAKE_FILE}.bak"
            sed -i "s|set(SDK_PATH \"[^\"]*\")|set(SDK_PATH \"${SDK_PATH}\")|" "${CMAKE_FILE}"
            sed -i "s|set(PKG_PATH \"[^\"]*\")|set(PKG_PATH \"${SDK_PATH}/..\")|" "${CMAKE_FILE}"
            echo "[OK] Patched CMake with SDK_PATH=${SDK_PATH}"
        fi

        # ========== Configure ==========
        cd "${CMAKE_DIR}"
        export ARM_GCC_DIR="/usr"
        export NINJA_EXE_PATH="/usr/bin/ninja"
        export SILABS_SDK_PATH="${SDK_PATH}"

        echo ""
        echo "=== Configuring CMake ==="
        echo "  Preset:  ${CMAKE_PRESET}"
        echo "  Config:  ${BUILD_CONFIG}"
        echo "  SDK:     ${SDK_PATH}"

        cmake --preset "${CMAKE_PRESET}" \
              -D"CMAKE_CONFIGURATION_TYPES=${BUILD_CONFIG}" \
              -D"ARM_GCC_DIR=${ARM_GCC_DIR}" \
              -D"NINJA_EXE_PATH=${NINJA_EXE_PATH}" 2>&1
        CFG_RESULT=$?

        BUILD_DIR="${CMAKE_DIR}/build"
        if [ ${CFG_RESULT} -ne 0 ] || [ ! -d "${BUILD_DIR}" ]; then
            echo "::error::CMake configure failed (exit=${CFG_RESULT})"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
            if [ "${FAIL_ON_ERROR}" == "true" ]; then
                exit 1
            fi
            cd "${WORKSPACE}"
            exit 0
        fi

        # ========== Build ==========
        echo "=== Building ==="
        cmake --build "${BUILD_DIR}" --config "${BUILD_CONFIG}" 2>&1
        BUILD_RESULT=$?
        cd "${WORKSPACE}"

        if [ ${BUILD_RESULT} -ne 0 ]; then
            echo "::error::Build failed (exit=${BUILD_RESULT})"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
            if [ "${FAIL_ON_ERROR}" == "true" ]; then
                exit 1
            fi
            cd "${WORKSPACE}"
            exit 0
        fi
        echo "[OK] Build succeeded"

        # ========== Collect artifacts ==========
        echo "=== Collecting Artifacts ==="
        FW_DIR="${BUILD_DIR}/${BUILD_CONFIG}"
        [ ! -d "${FW_DIR}" ] && FW_DIR="${BUILD_DIR}"
        copied=0
        for ext in .bin .hex .s37 .map .out; do
            src="${FW_DIR}/${PROJECT_NAME}${ext}"
            if [ -f "${src}" ]; then
                cp "${src}" "${OUT_DIR}/"
                size=$(stat --format=%s "${src}" 2>/dev/null || echo "?")
                echo "  [OK] ${PROJECT_NAME}${ext} (${size} bytes)"
                copied=$((copied + 1))
            fi
        done
        if [ ${copied} -eq 0 ]; then
            echo "::warning::No firmware artifacts found"
            echo "success=false" >> $GITHUB_OUTPUT
        else
            echo "[OK] Collected ${copied} artifact(s)"
            echo "success=true" >> $GITHUB_OUTPUT
        fi
        echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT

        echo ""
        echo "=== Build Summary ==="
        echo "Result: $([ ${copied} -gt 0 ] && echo 'SUCCESS' || echo 'NO ARTIFACTS')"
        echo "SDK:    ${SDK_PATH}"
        echo "Output: ${OUT_DIR}/"