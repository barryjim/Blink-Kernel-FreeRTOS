name: 'Embedded Firmware Builder (Composite)'
description: 'Build embedded firmware using ARM GCC cross-compiler.'
inputs:
  cmake_preset:
    description: 'CMake preset name (defined in CMakePresets.json)'
    required: false
    default: 'project'
  build_config:
    description: 'Build configuration (e.g., base, debug, release)'
    required: false
    default: 'base'
  fail_on_error:
    description: 'Fail the workflow if build fails'
    required: false
    default: 'false'

outputs:
  success:
    description: 'Build result (true/false)'
    value: ${{ steps.build.outputs.success }}
  artifacts_dir:
    description: 'Path to the built artifacts directory'
    value: ${{ steps.build.outputs.artifacts_dir }}

runs:
  using: 'composite'
  steps:
    - name: Maximize runner disk space
      uses: ./.github/actions/maximize-runner-disk

    - name: Install build tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gcc-arm-none-eabi cmake ninja-build binutils-arm-none-eabi libnewlib-arm-none-eabi python3 python3-pip

    - name: Install Java & SLC-CLI
      shell: bash
      run: |
        echo "=== Installing Java (JDK 11) ==="
        sudo apt-get install -y -qq openjdk-11-jre-headless 2>/dev/null || \
        sudo apt-get install -y -qq openjdk-17-jre-headless 2>/dev/null || \
        sudo apt-get install -y -qq default-jre-headless
        echo "[OK] Java: $(java -version 2>&1 | head -1)"

        echo ""
        echo "=== Downloading SLC-CLI ==="
        SLC_DIR="${RUNNER_TEMP}/slc-cli"
        mkdir -p "${SLC_DIR}"
        cd "${SLC_DIR}"

        SLC_DOWNLOADED=0
        SLC_URLS=(
          "https://www.silabs.com/documents/public/software/slc-cli-linux-amd64.tar.gz"
          "https://www.silabs.com/documents/public/software/slc-cli-linux.tar.gz"
          "https://www.silabs.com/develop-tools/simplicity-studio/slc-cli"
        )

        for url in "${SLC_URLS[@]}"; do
          echo "Trying: ${url}"
          if wget -q --timeout=30 --tries=2 "${url}" -O slc-cli.tar.gz 2>&1; then
            echo "[OK] Downloaded SLC-CLI from ${url}"
            tar xzf slc-cli.tar.gz 2>/dev/null || tar xf slc-cli.tar.gz 2>/dev/null
            SLC_DOWNLOADED=1
            break
          fi
        done

        if [ ${SLC_DOWNLOADED} -eq 0 ]; then
          echo "[WARN] SLC-CLI download from Silicon Labs failed"
          echo "[INFO] Will use direct SDK download fallback"
        else
          SLC_BIN=$(find . -name "slc" -o -name "slc-cli" -type f 2>/dev/null | head -1)
          if [ -n "${SLC_BIN}" ]; then
            chmod +x "${SLC_BIN}"
            echo "[OK] Found SLC-CLI: ${SLC_BIN}"
            echo "${SLC_BIN}" > "${RUNNER_TEMP}/slc-path"
          fi
        fi

    - name: Verify toolchain
      shell: bash
      run: |
        echo "ARM GCC: $(arm-none-eabi-gcc --version | head -1)"
        echo "CMake:   $(cmake --version | head -1)"
        echo "Ninja:   $(ninja --version)"
        echo "Python:  $(python3 --version)"
        echo "Java:    $(java -version 2>&1 | head -1)"
        SLC_PATH=$(cat "${RUNNER_TEMP}/slc-path" 2>/dev/null || echo "")
        echo "SLC-CLI: ${SLC_PATH:-not available}"

    - name: Build firmware
      id: build
      shell: bash
      run: |
        set +e
        WORKSPACE="${{ github.workspace }}"
        CMAKE_PRESET="${{ inputs.cmake_preset }}"
        BUILD_CONFIG="${{ inputs.build_config }}"
        FAIL_ON_ERROR="${{ inputs.fail_on_error }}"
        PROJECT_NAME="${{ github.event.repository.name }}"
        OUT_DIR="${WORKSPACE}/artifacts/${PROJECT_NAME}"
        mkdir -p "${OUT_DIR}"

        # ========== Locate CMake dir ==========
        CMAKE_DIR=""
        if [ -f "${WORKSPACE}/cmake_gcc/CMakePresets.json" ]; then
            CMAKE_DIR="${WORKSPACE}/cmake_gcc"
        elif [ -f "${WORKSPACE}/CMakePresets.json" ]; then
            CMAKE_DIR="${WORKSPACE}"
        else
            echo "::error::No CMakePresets.json found"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
            exit 0
        fi

        # ========== Install SDK ==========
        SDK_DIR="${WORKSPACE}/simplicity_sdk"
        mkdir -p "${SDK_DIR}"
        SLC_PATH=$(cat "${RUNNER_TEMP}/slc-path" 2>/dev/null || echo "")
        SDK_PATH=""

        echo "=== Silicon Labs SDK Setup ==="

        # --- Method 1: SLC-CLI (if available) ---
        if [ -n "${SLC_PATH}" ] && [ -x "${SLC_PATH}" ]; then
          echo "[METHOD 1] Using SLC-CLI to install SDK..."
          "${SLC_PATH}" --version 2>&1 || true

          SLCP_FILE="${WORKSPACE}/${PROJECT_NAME}.slcp"
          if [ -f "${SLCP_FILE}" ]; then
            echo "  Using project config: ${SLCP_FILE}"
            "${SLC_PATH}" project generate --update -p "${SLCP_FILE}" 2>&1 || true
          fi

          for pkg in simplicity_sdk simg301 simplemg301; do
            echo "  Trying: slc sdk install ${pkg}"
            "${SLC_PATH}" sdk install "${pkg}" 2>&1 && { echo "[OK] Installed: ${pkg}"; break; }
          done
        fi

        # --- Method 2: Search filesystem ---
        echo ""
        echo "[METHOD 2] Searching for SDK..."
        for candidate in \
            "${SDK_DIR}" \
            "${HOME}/.slc/sdk" \
            "${HOME}/.silabs/slt/installs" \
            "/opt/simplicity-sdk" \
            "/tmp/simplicity_sdk"; do
            if [ -d "${candidate}" ] && [ -d "${candidate}/devices/platform/Device/SiliconLabs/SIMG301" ]; then
                SDK_PATH="${candidate}"
                echo "[OK] Found SDK: ${SDK_PATH}"
                break
            fi
        done

        if [ -z "${SDK_PATH}" ]; then
            SDK_PATH=$(find "${HOME}" /opt /usr/share /tmp -maxdepth 8 \
                -type d -name "SIMG301" -path "*/Device/SiliconLabs/*" 2>/dev/null | head -1 | sed 's|/devices.*||')
            [ -n "${SDK_PATH}" ] && echo "[OK] Found SDK: ${SDK_PATH}"
        fi

        # --- Method 3: Direct SDK download ---
        if [ -z "${SDK_PATH}" ]; then
          echo ""
          echo "[METHOD 3] Direct SDK download..."
          SDK_URLS=(
            "https://www.silabs.com/documents/public/software/simplicity-sdk-2025.12.2-linux-amd64.tar.gz"
            "https://www.silabs.com/documents/public/software/simplicity-sdk-linux.tar.gz"
            "https://github.com/SiliconLabs/simplicity-sdk/releases/download/v2025.12.2/simplicity-sdk-2025.12.2.tar.gz"
          )
          for url in "${SDK_URLS[@]}"; do
            echo "  Trying: ${url}"
            if wget -q --timeout=60 --tries=2 "${url}" -O /tmp/simplicity-sdk.tar.gz 2>&1; then
              echo "[OK] Downloaded SDK, extracting..."
              tar xzf /tmp/simplicity-sdk.tar.gz -C "${SDK_DIR}" 2>/dev/null || \
              tar xf /tmp/simplicity-sdk.tar.gz -C "${SDK_DIR}" 2>/dev/null
              SDK_PATH=$(find "${SDK_DIR}" -maxdepth 3 -name "SIMG301" -type d 2>/dev/null | head -1 | sed 's|/devices.*||')
              [ -n "${SDK_PATH}" ] || SDK_PATH="${SDK_DIR}"
              [ -n "${SDK_PATH}" ] && echo "[OK] SDK at: ${SDK_PATH}"
              break
            fi
          done
        fi

        if [ -z "${SDK_PATH}" ]; then
          echo "::error::SDK not found. Cannot build."
          echo "::error::Please download Silicon Labs SDK manually:"
          echo "::error::  1. Visit https://www.silabs.com/develop-tools/simplicity-studio"
          echo "::error::  2. Download Simplicity SDK for MG301 (SIMG301M104LIL)"
          echo "::error::  3. Store as GitHub release asset or configure SLC-CLI"
          echo "success=false" >> $GITHUB_OUTPUT
          echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
          if [ "${FAIL_ON_ERROR}" == "true" ]; then
            exit 1
          fi
          exit 0
        fi

        # ========== Patch CMake file ==========
        CMAKE_FILE="${CMAKE_DIR}/blink_kernel_freertos_s3.cmake"
        if [ -f "${CMAKE_FILE}" ]; then
            cp "${CMAKE_FILE}" "${CMAKE_FILE}.bak"
            sed -i "s|set(SDK_PATH \"[^\"]*\")|set(SDK_PATH \"${SDK_PATH}\")|" "${CMAKE_FILE}"
            sed -i "s|set(PKG_PATH \"[^\"]*\")|set(PKG_PATH \"${SDK_PATH}/..\")|" "${CMAKE_FILE}"
            echo "[OK] Patched CMake with SDK_PATH=${SDK_PATH}"
        fi

        # ========== Configure ==========
        cd "${CMAKE_DIR}"
        export ARM_GCC_DIR="/usr"
        export NINJA_EXE_PATH="/usr/bin/ninja"
        export SILABS_SDK_PATH="${SDK_PATH}"

        echo "=== Configuring CMake ==="
        echo "  Preset:  ${CMAKE_PRESET}"
        echo "  Config:  ${BUILD_CONFIG}"
        echo "  SDK:     ${SDK_PATH}"

        cmake --preset "${CMAKE_PRESET}" \
              -D"CMAKE_CONFIGURATION_TYPES=${BUILD_CONFIG}" \
              -D"ARM_GCC_DIR=${ARM_GCC_DIR}" \
              -D"NINJA_EXE_PATH=${NINJA_EXE_PATH}" 2>&1
        CFG_RESULT=$?

        BUILD_DIR="${CMAKE_DIR}/build"
        if [ ${CFG_RESULT} -ne 0 ] || [ ! -d "${BUILD_DIR}" ]; then
            echo "::error::CMake configure failed (exit=${CFG_RESULT})"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
            if [ "${FAIL_ON_ERROR}" == "true" ]; then
                exit 1
            fi
            cd "${WORKSPACE}"
            exit 0
        fi

        # ========== Build ==========
        echo "=== Building ==="
        cmake --build "${BUILD_DIR}" --config "${BUILD_CONFIG}" 2>&1
        BUILD_RESULT=$?
        cd "${WORKSPACE}"

        if [ ${BUILD_RESULT} -ne 0 ]; then
            echo "::error::Build failed (exit=${BUILD_RESULT})"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT
            if [ "${FAIL_ON_ERROR}" == "true" ]; then
                exit 1
            fi
            cd "${WORKSPACE}"
            exit 0
        fi
        echo "[OK] Build succeeded"

        # ========== Collect artifacts ==========
        echo "=== Collecting Artifacts ==="
        FW_DIR="${BUILD_DIR}/${BUILD_CONFIG}"
        [ ! -d "${FW_DIR}" ] && FW_DIR="${BUILD_DIR}"
        copied=0
        for ext in .bin .hex .s37 .map .out; do
            src="${FW_DIR}/${PROJECT_NAME}${ext}"
            if [ -f "${src}" ]; then
                cp "${src}" "${OUT_DIR}/"
                size=$(stat --format=%s "${src}" 2>/dev/null || echo "?")
                echo "  [OK] ${PROJECT_NAME}${ext} (${size} bytes)"
                copied=$((copied + 1))
            fi
        done
        if [ ${copied} -eq 0 ]; then
            echo "::warning::No firmware artifacts found"
            echo "success=false" >> $GITHUB_OUTPUT
        else
            echo "[OK] Collected ${copied} artifact(s)"
            echo "success=true" >> $GITHUB_OUTPUT
        fi
        echo "artifacts_dir=${OUT_DIR}" >> $GITHUB_OUTPUT

        echo ""
        echo "=== Build Summary ==="
        echo "Result: $([ ${copied} -gt 0 ] && echo 'SUCCESS' || echo 'NO ARTIFACTS')"
        echo "SDK:    ${SDK_PATH}"
        echo "Output: ${OUT_DIR}/"