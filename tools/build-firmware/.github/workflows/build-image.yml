name: Build & Publish Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'action.yml'
      - '.github/workflows/build-image.yml'
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: firmware-builder

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest
          labels: |
            org.opencontainers.image.title=${IMAGE_NAME}
            org.opencontainers.image.description=Embedded firmware build environment
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Verify Image
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Test container
        run: |
          docker run --rm \
            ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest \
            bash -c "arm-none-eabi-gcc --version && cmake --version && ninja --version && echo 'All tools OK'"